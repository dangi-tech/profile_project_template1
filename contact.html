
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Habtamu</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                Habtamu.
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="contact-section">


            <!-- Contact Information -->
            <div class="contact-info">

                <p class="small-title">
                    GET IN TOUCH
                </p>

                <h1>
                    Contact Me
                </h1>

                <p>
                    Have a project idea or want to get
                    in touch? Send me a message using
                    the form.
                </p>


                <div class="contact-details">

                    <div>
                        <h3>Email</h3>
                        <p>habtamu@example.com</p>
                    </div>

                    <div>
                        <h3>Location</h3>
                        <p>Ethiopia</p>
                    </div>

                </div>


                <!-- Social Links -->
                <div class="social-links">

                    <a href="#">
                        GitHub
                    </a>

                    <a href="#">
                        LinkedIn
                    </a>

                    <a href="#">
                        Telegram
                    </a>

                </div>

            </div>


            <!-- Contact Form -->
            <div class="contact-form">

                <form>


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter subject"
                        >

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Write your message..."
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Habtamu Wossen.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
